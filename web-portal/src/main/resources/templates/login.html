<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart University - Accedi</title>
    <!-- Bootstrap CSS per una grafica moderna e accattivante -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/tailwind.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #001233 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.95);
        }
        .btn-primary {
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <div class="card-body">
                    <h2 class="text-center mb-4 text-primary fw-bold">Smart University</h2>
                    <h5 class="text-center text-muted mb-4">Accedi al Portale</h5>

                    <!-- Messaggio di errore dinamico in caso di credenziali errate -->
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
                        Errore generico di login.
                    </div>

                    <!-- Messaggio di avviso in caso di disconnessione -->
                    <div th:if="${message}" class="alert alert-info" role="alert" th:text="${message}">
                        Messaggio informativo.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="es. mario.rossi" required autocomplete="username">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-block">Accedi</button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="text-center text-white-50 mt-4">&copy; 2026 Università degli Studi di Catania</p>
        </div>
    </div>
</div>

</body>
</html>
